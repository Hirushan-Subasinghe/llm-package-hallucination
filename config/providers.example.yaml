# Workflow configuration contains no credentials. Exact visible model/tool
# versions are recorded at generation time only when the interface exposes them.
workflows:
  chatgpt_web:
    workflow: ChatGPT Web
    provider: OpenAI
    interface: web
    enabled: false
    visible_model_version: null

  gemini_web:
    workflow: Gemini Web
    provider: Google
    interface: web
    enabled: false
    visible_model_version: null

  codex_cli:
    workflow: Codex CLI
    provider: OpenAI
    interface: cli
    enabled: false
    executable: null
    visible_model_version: null
    cli_version: null
    timeout_seconds: null

  antigravity_cli_gemini:
    workflow: Antigravity CLI — Gemini
    provider: Google
    interface: cli
    enabled: false
    executable: null
    visible_model_version: null
    cli_version: null
    timeout_seconds: null

# Executable commands and timeouts must be configured and verified before CLI
# execution. Do not place API keys, tokens, cookies, or passwords in this file.
