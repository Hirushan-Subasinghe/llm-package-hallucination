[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-package-hallucination"
version = "0.1.0"
description = "Infrastructure for a reproducible experiment on npm package hallucination in AI-generated Node.js code."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Research Project Contributors" }]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
