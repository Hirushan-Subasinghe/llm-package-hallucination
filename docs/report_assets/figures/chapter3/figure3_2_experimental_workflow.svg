<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1742" viewBox="0 0 1200 1742" role="img" aria-labelledby="title desc">
  <title id="title">Final v2.6 experimental workflow and preservation boundary</title>
  <desc id="desc">Frozen v2.6 inputs feed API-assigned and manual-assigned collection routes (180 planned rows each), which converge into preserved raw collection evidence. A dashed preservation boundary separates this evidence from derived analytical processing: a derived response inventory with COMPLETED, TRUNCATED and FAILED states, package-reference extraction, read-only npm registry validation, classification and adjudication, an analysis-ready dataset, and analysis procedures. Arrows cross the boundary in one direction only.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
  </defs>
  <rect width="1200" height="1742" fill="#ffffff"/>
  <g font-family="Helvetica, Arial, sans-serif">
  <rect id="zone_a" x="10" y="10" width="1180" height="690" rx="12" fill="#FFFFFF" stroke="#9A9A9A" stroke-width="1.5"/>
  <rect id="inputs_group" x="30" y="54" width="1140" height="188" rx="12" fill="#F7F7F7" stroke="#7A7A7A" stroke-width="2"/>
  <rect id="in_tasks" x="50.0" y="106" width="212" height="122" rx="7" fill="#FFFFFF" stroke="#555555" stroke-width="2"/>
  <text x="156.0" y="160.1" font-size="23" text-anchor="middle" fill="#202020">30-task</text>
  <text x="156.0" y="190.0" font-size="23" text-anchor="middle" fill="#202020">frozen task set</text>
  <rect id="in_template" x="272.0" y="106" width="212" height="122" rx="7" fill="#FFFFFF" stroke="#555555" stroke-width="2"/>
  <text x="378.0" y="160.1" font-size="23" text-anchor="middle" fill="#202020">Common</text>
  <text x="378.0" y="190.0" font-size="23" text-anchor="middle" fill="#202020">prompt template</text>
  <rect id="in_rendered" x="494.0" y="106" width="212" height="122" rx="7" fill="#FFFFFF" stroke="#555555" stroke-width="2"/>
  <text x="600.0" y="160.1" font-size="23" text-anchor="middle" fill="#202020">Rendered</text>
  <text x="600.0" y="190.0" font-size="23" text-anchor="middle" fill="#202020">prompts</text>
  <rect id="in_models" x="716.0" y="106" width="212" height="122" rx="7" fill="#FFFFFF" stroke="#555555" stroke-width="2"/>
  <text x="822.0" y="145.2" font-size="23" text-anchor="middle" fill="#202020">Four model</text>
  <text x="822.0" y="175.1" font-size="23" text-anchor="middle" fill="#202020">conditions</text>
  <text x="822.0" y="205.0" font-size="23" text-anchor="middle" fill="#202020">(M1 to M4)</text>
  <rect id="in_manifest" x="938.0" y="106" width="212" height="122" rx="7" fill="#FFFFFF" stroke="#555555" stroke-width="2"/>
  <text x="1044.0" y="145.2" font-size="23" text-anchor="middle" fill="#202020">Frozen manifest:</text>
  <text x="1044.0" y="175.1" font-size="23" text-anchor="middle" fill="#202020">planned run</text>
  <text x="1044.0" y="205.0" font-size="23" text-anchor="middle" fill="#202020">identities</text>
  <rect id="route_group" x="30" y="268" width="1140" height="222" rx="12" fill="#F7F7F7" stroke="#7A7A7A" stroke-width="2"/>
  <rect id="route_api" x="110" y="352" width="420" height="90" rx="7" fill="#FFFFFF" stroke="#555555" stroke-width="2"/>
  <text x="320.0" y="390.8" font-size="25" text-anchor="middle" fill="#202020" font-weight="700">API-assigned route</text>
  <text x="320.0" y="421.3" font-size="23" text-anchor="middle" fill="#202020">180 planned manifest rows</text>
  <rect id="route_manual" x="670" y="352" width="420" height="90" rx="7" fill="#FFFFFF" stroke="#555555" stroke-width="2"/>
  <text x="880.0" y="390.8" font-size="25" text-anchor="middle" fill="#202020" font-weight="700">Manual-assigned route</text>
  <text x="880.0" y="421.3" font-size="23" text-anchor="middle" fill="#202020">180 planned manifest rows</text>
  <rect id="evidence" x="290" y="510" width="620" height="176" rx="7" fill="#EAF1F4" stroke="#426A7A" stroke-width="3"/>
  <text x="600.0" y="547.3" font-size="26" text-anchor="middle" fill="#202020" font-weight="700">Preserved raw collection evidence</text>
  <text x="600.0" y="578.1" font-size="23" text-anchor="middle" fill="#202020">Exact prompt  •  Response content</text>
  <text x="600.0" y="608.0" font-size="23" text-anchor="middle" fill="#202020">Metadata and status fields</text>
  <text x="600.0" y="637.9" font-size="23" text-anchor="middle" fill="#202020">Request/provider evidence where applicable</text>
  <text x="600.0" y="667.8" font-size="23" text-anchor="middle" fill="#4A4A4A" font-style="italic">Append-only; not rewritten by later stages</text>
  <rect id="zone_b" x="10" y="830" width="1180" height="902" rx="12" fill="#FFFFFF" stroke="#9A9A9A" stroke-width="1.5"/>
  <rect id="inventory" x="180" y="876" width="840" height="150" rx="7" fill="#FFFFFF" stroke="#555555" stroke-width="2"/>
  <text x="600.0" y="914.0" font-size="26" text-anchor="middle" fill="#202020" font-weight="700">Derived response inventory and status</text>
  <rect id="status_completed" x="235" y="930" width="220" height="50" rx="6" fill="#F0F0F0" stroke="#666666" stroke-width="2"/>
  <text x="345.0" y="963.0" font-size="23" text-anchor="middle" fill="#202020" font-weight="700">COMPLETED</text>
  <rect id="status_truncated" x="490" y="930" width="220" height="50" rx="6" fill="#F0F0F0" stroke="#666666" stroke-width="2"/>
  <text x="600.0" y="963.0" font-size="23" text-anchor="middle" fill="#202020" font-weight="700">TRUNCATED</text>
  <rect id="status_failed" x="745" y="930" width="220" height="50" rx="6" fill="#F0F0F0" stroke="#666666" stroke-width="2"/>
  <text x="855.0" y="963.0" font-size="23" text-anchor="middle" fill="#202020" font-weight="700">FAILED</text>
  <rect id="pipeline_group" x="110" y="1052" width="980" height="418" rx="12" fill="#F7F7F7" stroke="#7A7A7A" stroke-width="2"/>
  <rect id="p_extract" x="180" y="1104" width="840" height="70" rx="7" fill="#FFFFFF" stroke="#555555" stroke-width="2"/>
  <text x="600.0" y="1132.8" font-size="25" text-anchor="middle" fill="#202020" font-weight="700">Package-reference extraction and normalisation</text>
  <text x="600.0" y="1163.3" font-size="23" text-anchor="middle" fill="#4A4A4A" font-style="italic">Direct, explicit npm references from preserved text</text>
  <rect id="p_registry" x="180" y="1200" width="840" height="70" rx="7" fill="#FFFFFF" stroke="#555555" stroke-width="2"/>
  <text x="600.0" y="1228.8" font-size="25" text-anchor="middle" fill="#202020" font-weight="700">Official npm registry validation</text>
  <text x="600.0" y="1259.3" font-size="23" text-anchor="middle" fill="#4A4A4A" font-style="italic">exists  |  not_found  |  unresolved</text>
  <rect id="p_classify" x="180" y="1296" width="840" height="70" rx="7" fill="#FFFFFF" stroke="#555555" stroke-width="2"/>
  <text x="600.0" y="1324.8" font-size="25" text-anchor="middle" fill="#202020" font-weight="700">Classification and adjudication</text>
  <text x="600.0" y="1355.3" font-size="23" text-anchor="middle" fill="#4A4A4A" font-style="italic">Registry evidence alone does not establish a hallucination</text>
  <rect id="p_dataset" x="180" y="1392" width="840" height="70" rx="7" fill="#EAF1F4" stroke="#426A7A" stroke-width="3"/>
  <text x="600.0" y="1420.8" font-size="25" text-anchor="middle" fill="#202020" font-weight="700">Analysis-ready dataset</text>
  <text x="600.0" y="1451.3" font-size="23" text-anchor="middle" fill="#4A4A4A" font-style="italic">Package eligibility inherited from response status</text>
  <rect id="outputs_group" x="30" y="1494" width="1140" height="222" rx="12" fill="#F7F7F7" stroke="#7A7A7A" stroke-width="2"/>
  <rect id="o_primary" x="44" y="1546" width="550" height="72" rx="7" fill="#FFFFFF" stroke="#555555" stroke-width="2"/>
  <text x="319.0" y="1575.5" font-size="24" text-anchor="middle" fill="#202020" font-weight="700">Primary hallucination metrics</text>
  <text x="319.0" y="1605.7" font-size="23" text-anchor="middle" fill="#4A4A4A">PHR / SHR</text>
  <rect id="o_secondary" x="606" y="1546" width="550" height="72" rx="7" fill="#FFFFFF" stroke="#555555" stroke-width="2"/>
  <text x="881.0" y="1575.5" font-size="24" text-anchor="middle" fill="#202020" font-weight="700">Secondary dependency-reliability metrics</text>
  <text x="881.0" y="1605.7" font-size="23" text-anchor="middle" fill="#4A4A4A">DFR / RDFR</text>
  <rect id="o_stats" x="44" y="1630" width="550" height="72" rx="7" fill="#FFFFFF" stroke="#555555" stroke-width="2"/>
  <text x="319.0" y="1659.5" font-size="24" text-anchor="middle" fill="#202020" font-weight="700">Grouped statistical analysis</text>
  <text x="319.0" y="1689.7" font-size="23" text-anchor="middle" fill="#4A4A4A">By model condition and task category</text>
  <rect id="o_risk" x="606" y="1630" width="550" height="72" rx="7" fill="#FFFFFF" stroke="#555555" stroke-width="2"/>
  <text x="881.0" y="1659.5" font-size="24" text-anchor="middle" fill="#202020" font-weight="700">Practical-risk assessment</text>
  <text x="881.0" y="1689.7" font-size="23" text-anchor="middle" fill="#4A4A4A">risk-model-1.0.0: Impact × Detectability</text>
  <text x="36.0" y="41.0" font-size="23" text-anchor="start" fill="#426A7A" font-weight="700">FROZEN INPUTS AND PRESERVED COLLECTION EVIDENCE</text>
  <text x="600.0" y="90.8" font-size="28" text-anchor="middle" fill="#202020" font-weight="700">Frozen v2.6 experiment inputs</text>
  <text x="600.0" y="304.8" font-size="28" text-anchor="middle" fill="#202020" font-weight="700">Assigned collection route</text>
  <text x="600.0" y="338.1" font-size="23" text-anchor="middle" fill="#4A4A4A" font-style="italic">Planned, non-randomised assignment (not achieved counts)</text>
  <text x="600.0" y="473.1" font-size="23" text-anchor="middle" fill="#4A4A4A" font-weight="700">Collection route ≠ analytical eligibility</text>
  <text x="36.0" y="736.1" font-size="26" text-anchor="start" fill="#202020" font-weight="700">PRESERVATION BOUNDARY</text>
  <text x="36.0" y="783.1" font-size="23" text-anchor="start" fill="#4A4A4A" font-style="italic">Raw evidence preserved; downstream stages</text>
  <text x="36.0" y="813.0" font-size="23" text-anchor="start" fill="#4A4A4A" font-style="italic">create derived outputs only</text>
  <text x="636.0" y="736.0" font-size="23" text-anchor="start" fill="#4A4A4A" font-style="italic">One-way: analysis reads preserved evidence</text>
  <text x="36.0" y="861.0" font-size="23" text-anchor="start" fill="#426A7A" font-weight="700">DERIVED ANALYTICAL PROCESSING</text>
  <text x="600.0" y="1007.0" font-size="23" text-anchor="middle" fill="#4A4A4A" font-style="italic">Eligibility derived from response status</text>
  <text x="600.0" y="1088.1" font-size="26" text-anchor="middle" fill="#202020" font-weight="700">Package analysis pipeline</text>
  <text x="600.0" y="1530.1" font-size="26" text-anchor="middle" fill="#202020" font-weight="700">Analysis procedures (methods, not results)</text>
  <line id="boundary_line" x1="10" y1="752" x2="1190" y2="752" stroke="#333333" stroke-width="3" stroke-dasharray="14 8"/>
  <path id="e_inputs_route" d="M 600 242 L 600 268" fill="none" stroke="#333333" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path id="e_api_evidence" d="M 230 442 L 230 598 L 290 598" fill="none" stroke="#333333" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path id="e_manual_evidence" d="M 970 442 L 970 598 L 910 598" fill="none" stroke="#333333" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path id="e_evidence_inventory" d="M 600 686 L 600 876" fill="none" stroke="#333333" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path id="e_inventory_pipeline" d="M 600 1026 L 600 1052" fill="none" stroke="#333333" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path id="e_p_extract_p_registry" d="M 600 1174 L 600 1200" fill="none" stroke="#333333" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path id="e_p_registry_p_classify" d="M 600 1270 L 600 1296" fill="none" stroke="#333333" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path id="e_p_classify_p_dataset" d="M 600 1366 L 600 1392" fill="none" stroke="#333333" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path id="e_dataset_outputs" d="M 600 1470 L 600 1494" fill="none" stroke="#333333" stroke-width="2.5" marker-end="url(#arrow)"/>
  </g>
</svg>
