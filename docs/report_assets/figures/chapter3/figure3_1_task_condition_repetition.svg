<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" role="img" aria-labelledby="title desc">
  <title id="title">Frozen task-condition-repetition design</title>
  <desc id="desc">Six functional categories with five frozen tasks per category form 30 frozen tasks. Thirty tasks multiplied by four frozen model conditions and three planned repeated generations give 360 planned observations.</desc>
  <defs>
    <style>
      .sans { font-family: Helvetica, Arial, sans-serif; fill: #202020; }
      .group { fill: #f7f7f7; stroke: #7a7a7a; stroke-width: 2; }
      .box { fill: #ffffff; stroke: #555555; stroke-width: 2; }
      .accent { fill: #eaf1f4; stroke: #426a7a; stroke-width: 3; }
      .chip-accent { fill: #eaf1f4; stroke: #426a7a; stroke-width: 2; }
      .chip-grey { fill: #f0f0f0; stroke: #666666; stroke-width: 2; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
  </defs>

  <rect width="1200" height="960" fill="#ffffff"/>

  <rect class="group" x="30" y="20" width="1140" height="280" rx="12"/>
  <text class="sans" x="600" y="59" text-anchor="middle" font-size="26" font-weight="700">6 functional categories  •  5 frozen tasks per category</text>

  <g class="sans" text-anchor="middle" font-size="22">
    <rect class="box" x="60" y="85" width="320" height="80" rx="7"/>
    <text x="220" y="119"><tspan x="220">Identity, Authentication</tspan><tspan x="220" dy="28">&amp; Federation</tspan></text>

    <rect class="box" x="440" y="85" width="320" height="80" rx="7"/>
    <text x="600" y="119"><tspan x="600">PKI, Cryptography</tspan><tspan x="600" dy="28">&amp; Trust Services</tspan></text>

    <rect class="box" x="820" y="85" width="320" height="80" rx="7"/>
    <text x="980" y="119"><tspan x="980">Complex Documents</tspan><tspan x="980" dy="28">&amp; Binary Formats</tspan></text>

    <rect class="box" x="60" y="190" width="320" height="80" rx="7"/>
    <text x="220" y="224"><tspan x="220">Enterprise Messaging</tspan><tspan x="220" dy="28">&amp; Interoperability</tspan></text>

    <rect class="box" x="440" y="190" width="320" height="80" rx="7"/>
    <text x="600" y="224"><tspan x="600">Specialized Data</tspan><tspan x="600" dy="28">&amp; Storage Integration</tspan></text>

    <rect class="box" x="820" y="190" width="320" height="80" rx="7"/>
    <text x="980" y="224"><tspan x="980">Distributed Systems</tspan><tspan x="980" dy="28">&amp; Observability</tspan></text>
  </g>

  <line x1="600" y1="300" x2="600" y2="324" stroke="#333333" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect class="accent" x="430" y="330" width="340" height="80" rx="10"/>
  <text class="sans" x="600" y="380" text-anchor="middle" font-size="30"><tspan font-weight="700">30</tspan><tspan dx="8">frozen tasks</tspan></text>

  <text class="sans" x="600" y="450" text-anchor="middle" font-size="38" font-weight="700">×</text>

  <rect class="box" x="350" y="460" width="500" height="110" rx="8"/>
  <text class="sans" x="600" y="496" text-anchor="middle" font-size="25"><tspan font-weight="700">4</tspan><tspan dx="8">frozen model conditions</tspan></text>
  <g class="sans" text-anchor="middle" font-size="22" font-weight="700">
    <rect class="chip-accent" x="390" y="515" width="80" height="40" rx="7"/><text x="430" y="543">M1</text>
    <rect class="chip-accent" x="485" y="515" width="80" height="40" rx="7"/><text x="525" y="543">M2</text>
    <rect class="chip-accent" x="580" y="515" width="80" height="40" rx="7"/><text x="620" y="543">M3</text>
    <rect class="chip-accent" x="675" y="515" width="80" height="40" rx="7"/><text x="715" y="543">M4</text>
  </g>

  <text class="sans" x="600" y="610" text-anchor="middle" font-size="38" font-weight="700">×</text>

  <rect class="box" x="350" y="620" width="500" height="110" rx="8"/>
  <text class="sans" x="600" y="656" text-anchor="middle" font-size="25"><tspan font-weight="700">3</tspan><tspan dx="8">planned repeated generations</tspan></text>
  <g class="sans" text-anchor="middle" font-size="22" font-weight="700">
    <rect class="chip-grey" x="440" y="675" width="90" height="40" rx="7"/><text x="485" y="703">R01</text>
    <rect class="chip-grey" x="555" y="675" width="90" height="40" rx="7"/><text x="600" y="703">R02</text>
    <rect class="chip-grey" x="670" y="675" width="90" height="40" rx="7"/><text x="715" y="703">R03</text>
  </g>

  <text class="sans" x="600" y="770" text-anchor="middle" font-size="38" font-weight="700">=</text>

  <rect class="accent" x="410" y="780" width="380" height="85" rx="10"/>
  <text class="sans" x="600" y="833" text-anchor="middle" font-size="30"><tspan font-weight="700">360</tspan><tspan dx="8">planned observations</tspan></text>

  <text class="sans" x="600" y="909" text-anchor="middle" font-size="19" font-style="italic" fill="#444444">
    <tspan x="600">Planned design total, not an achieved or analytically eligible count.</tspan>
    <tspan x="600" dy="25">Repetitions were separate fresh requests.</tspan>
  </text>
</svg>
