<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800" role="img" aria-labelledby="title desc">
  <title id="title">Direct npm extraction, registry evidence, and conservative adjudication pipeline</title>
  <desc id="desc">A preserved eligible response is processed through explicit npm package-reference extraction and normalisation into unique run and package rows. Read-only official npm registry validation produces exists, not_found, or unresolved evidence states. Not_found routes only to conservative classification and adjudication, never directly to confirmed hallucination. Nine adjudication outcomes are shown, and only an eligible confirmed hallucination enters the single controlled confirmation path and can contribute to the primary hallucination numerator.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
  </defs>
  <rect width="1200" height="1800" fill="#FFFFFF"/>
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="30" y="41" font-size="23" font-weight="700" fill="#426A7A">STAGE 1  •  PRESERVED RESPONSE</text>
    <rect x="250" y="52" width="700" height="88" rx="7" fill="#EAF1F4" stroke="#426A7A" stroke-width="3"/>
    <text x="600" y="91" font-size="28" text-anchor="middle" font-weight="700" fill="#202020">Preserved eligible response</text>
    <text x="600" y="122" font-size="23" text-anchor="middle" font-style="italic" fill="#4A4A4A">Completed response used for primary analysis</text>

    <text x="30" y="197" font-size="23" font-weight="700" fill="#426A7A">STAGE 2  •  PACKAGE REFERENCE EXTRACTION</text>
    <rect x="30" y="210" width="1140" height="320" rx="12" fill="#F7F7F7" stroke="#7A7A7A" stroke-width="2"/>
    <rect x="160" y="230" width="880" height="112" rx="7" fill="#FFFFFF" stroke="#555555" stroke-width="2"/>
    <text x="600" y="266" font-size="27" text-anchor="middle" font-weight="700" fill="#202020">Package-reference extraction and normalisation</text>
    <text x="600" y="300" font-size="23" text-anchor="middle" fill="#4A4A4A">ESM import  •  require(...)  •  dynamic import(...)</text>
    <text x="600" y="330" font-size="23" text-anchor="middle" fill="#4A4A4A">npm install / npm i  •  package.json dependency fields</text>
    <rect x="95" y="382" width="490" height="92" rx="7" fill="#FFFFFF" stroke="#555555" stroke-width="2"/>
    <text x="340" y="418" font-size="25" text-anchor="middle" font-weight="700" fill="#202020">Normalised root npm package name</text>
    <text x="340" y="451" font-size="23" text-anchor="middle" fill="#4A4A4A">Scoped name retained; subpath reduced to root</text>
    <rect x="615" y="382" width="490" height="92" rx="7" fill="#EAF1F4" stroke="#426A7A" stroke-width="3"/>
    <text x="860" y="418" font-size="25" text-anchor="middle" font-weight="700" fill="#202020">Unique analytical unit</text>
    <text x="860" y="451" font-size="23" text-anchor="middle" fill="#4A4A4A">(run_id, normalized_package)</text>

    <text x="30" y="577" font-size="23" font-weight="700" fill="#426A7A">STAGE 3  •  OFFICIAL npm REGISTRY VALIDATION</text>
    <rect x="315" y="590" width="570" height="92" rx="7" fill="#FFFFFF" stroke="#555555" stroke-width="2"/>
    <text x="600" y="627" font-size="27" text-anchor="middle" font-weight="700" fill="#202020">Official npm registry</text>
    <text x="600" y="660" font-size="24" text-anchor="middle" fill="#4A4A4A">Read-only validation</text>
    <rect x="50" y="738" width="330" height="82" rx="7" fill="#F0F0F0" stroke="#666666" stroke-width="2"/>
    <text x="215" y="773" font-size="25" text-anchor="middle" font-weight="700" fill="#202020">exists</text>
    <text x="215" y="803" font-size="23" text-anchor="middle" fill="#4A4A4A">registry evidence state</text>
    <rect x="435" y="738" width="330" height="82" rx="7" fill="#EAF1F4" stroke="#426A7A" stroke-width="3"/>
    <text x="600" y="773" font-size="25" text-anchor="middle" font-weight="700" fill="#202020">not_found</text>
    <text x="600" y="803" font-size="23" text-anchor="middle" fill="#4A4A4A">registry evidence state</text>
    <rect x="820" y="738" width="330" height="82" rx="7" fill="#F0F0F0" stroke="#666666" stroke-width="2"/>
    <text x="985" y="773" font-size="25" text-anchor="middle" font-weight="700" fill="#202020">unresolved</text>
    <text x="985" y="803" font-size="23" text-anchor="middle" fill="#4A4A4A">registry evidence state</text>

    <text x="30" y="869" font-size="23" font-weight="700" fill="#426A7A">STAGE 4  •  CONSERVATIVE CLASSIFICATION</text>
    <rect x="50" y="882" width="330" height="90" rx="7" fill="#FFFFFF" stroke="#555555" stroke-width="2"/>
    <text x="215" y="920" font-size="25" text-anchor="middle" font-weight="700" fill="#202020">Valid / existing</text>
    <text x="215" y="953" font-size="23" text-anchor="middle" fill="#4A4A4A">No hallucination confirmation</text>
    <rect x="435" y="882" width="330" height="90" rx="7" fill="#EAF1F4" stroke="#426A7A" stroke-width="3"/>
    <text x="600" y="909" font-size="25" text-anchor="middle" font-weight="700" fill="#202020">Review / adjudication</text>
    <text x="600" y="936" font-size="25" text-anchor="middle" font-weight="700" fill="#202020">required</text>
    <text x="600" y="963" font-size="23" text-anchor="middle" fill="#4A4A4A">Conservative classification</text>
    <rect x="820" y="882" width="330" height="90" rx="7" fill="#FFFFFF" stroke="#555555" stroke-width="2"/>
    <text x="985" y="920" font-size="25" text-anchor="middle" font-weight="700" fill="#202020">Unresolved evidence</text>
    <text x="985" y="953" font-size="23" text-anchor="middle" fill="#4A4A4A">No registry conclusion</text>
    <rect x="245" y="995" width="710" height="48" rx="6" fill="#F7F7F7" stroke="#7A7A7A" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="600" y="1027" font-size="23" text-anchor="middle" fill="#202020"><tspan font-weight="700">Safeguard:</tspan> Registry evidence alone does not establish hallucination.</text>

    <text x="30" y="1083" font-size="23" font-weight="700" fill="#426A7A">STAGE 5  •  ADJUDICATION OUTCOMES</text>
    <rect x="30" y="1096" width="1140" height="336" rx="12" fill="#F7F7F7" stroke="#7A7A7A" stroke-width="2"/>
    <text x="600" y="1135" font-size="27" text-anchor="middle" font-weight="700" fill="#202020">Final adjudication taxonomy</text>
    <rect x="55" y="1154" width="350" height="62" rx="6" fill="#EAF1F4" stroke="#426A7A" stroke-width="3"/>
    <text x="230" y="1180" font-size="23" text-anchor="middle" font-weight="700" fill="#17262D">CONFIRMED_</text>
    <text x="230" y="1207" font-size="23" text-anchor="middle" font-weight="700" fill="#17262D">HALLUCINATION</text>
    <rect x="425" y="1154" width="350" height="62" rx="6" fill="#FFFFFF" stroke="#555555" stroke-width="2"/>
    <text x="600" y="1193" font-size="23" text-anchor="middle" fill="#202020">LEGACY_OR_REMOVED</text>
    <rect x="795" y="1154" width="350" height="62" rx="6" fill="#FFFFFF" stroke="#555555" stroke-width="2"/>
    <text x="970" y="1180" font-size="23" text-anchor="middle" fill="#202020">NAMESPACE_</text>
    <text x="970" y="1207" font-size="23" text-anchor="middle" fill="#202020">CONFUSION</text>
    <rect x="55" y="1228" width="350" height="62" rx="6" fill="#FFFFFF" stroke="#555555" stroke-width="2"/>
    <text x="230" y="1254" font-size="23" text-anchor="middle" fill="#202020">PACKAGE_NAME_</text>
    <text x="230" y="1281" font-size="23" text-anchor="middle" fill="#202020">CONFUSION</text>
    <rect x="425" y="1228" width="350" height="62" rx="6" fill="#FFFFFF" stroke="#555555" stroke-width="2"/>
    <text x="600" y="1254" font-size="23" text-anchor="middle" fill="#202020">INVALID_OR_REDUNDANT_</text>
    <text x="600" y="1281" font-size="23" text-anchor="middle" fill="#202020">TYPES_PACKAGE</text>
    <rect x="795" y="1228" width="350" height="62" rx="6" fill="#FFFFFF" stroke="#555555" stroke-width="2"/>
    <text x="970" y="1254" font-size="23" text-anchor="middle" fill="#202020">ECOSYSTEM_</text>
    <text x="970" y="1281" font-size="23" text-anchor="middle" fill="#202020">CONFUSION</text>
    <rect x="55" y="1302" width="350" height="62" rx="6" fill="#FFFFFF" stroke="#555555" stroke-width="2"/>
    <text x="230" y="1328" font-size="23" text-anchor="middle" fill="#202020">OTHER_DEPENDENCY_</text>
    <text x="230" y="1355" font-size="23" text-anchor="middle" fill="#202020">ERROR</text>
    <rect x="425" y="1302" width="350" height="62" rx="6" fill="#FFFFFF" stroke="#555555" stroke-width="2"/>
    <text x="600" y="1328" font-size="23" text-anchor="middle" fill="#202020">SELF_REFERENCE_OR_</text>
    <text x="600" y="1355" font-size="23" text-anchor="middle" fill="#202020">LOCAL_PACKAGE</text>
    <rect x="795" y="1302" width="350" height="62" rx="6" fill="#FFFFFF" stroke="#555555" stroke-width="2"/>
    <text x="970" y="1341" font-size="23" text-anchor="middle" fill="#202020">UNRESOLVED</text>
    <text x="600" y="1394" font-size="23" text-anchor="middle" font-style="italic" fill="#4A4A4A">SELF_REFERENCE_OR_LOCAL_PACKAGE requires response-internal evidence.</text>
    <text x="600" y="1421" font-size="23" text-anchor="middle" font-style="italic" fill="#4A4A4A">UNRESOLVED cases are not forced into a finding.</text>

    <text x="30" y="1473" font-size="23" font-weight="700" fill="#426A7A">STAGE 6  •  CONTROLLED CONFIRMATION RESOLUTION</text>
    <rect x="180" y="1488" width="840" height="90" rx="7" fill="#EAF1F4" stroke="#426A7A" stroke-width="3"/>
    <text x="600" y="1525" font-size="27" text-anchor="middle" font-weight="700" fill="#202020">Single controlled hallucination-confirmation path</text>
    <text x="600" y="1559" font-size="23" text-anchor="middle" fill="#4A4A4A">Eligible confirmation accepted once, with route and provenance retained</text>
    <rect x="30" y="1610" width="1140" height="108" rx="12" fill="#F7F7F7" stroke="#7A7A7A" stroke-width="2"/>
    <text x="600" y="1641" font-size="25" text-anchor="middle" font-weight="700" fill="#202020">Derived analysis indicators</text>
    <rect x="55" y="1652" width="340" height="50" rx="6" fill="#FFFFFF" stroke="#555555" stroke-width="2"/>
    <text x="225" y="1685" font-size="23" text-anchor="middle" fill="#202020">Confirmed hallucination?</text>
    <rect x="430" y="1652" width="340" height="50" rx="6" fill="#FFFFFF" stroke="#555555" stroke-width="2"/>
    <text x="600" y="1685" font-size="23" text-anchor="middle" fill="#202020">Dependency failure?</text>
    <rect x="805" y="1652" width="340" height="50" rx="6" fill="#FFFFFF" stroke="#555555" stroke-width="2"/>
    <text x="975" y="1685" font-size="23" text-anchor="middle" fill="#202020">External dependency eligible?</text>
    <rect x="115" y="1728" width="970" height="60" rx="6" fill="#FFFFFF" stroke="#426A7A" stroke-width="3"/>
    <text x="600" y="1753" font-size="23" text-anchor="middle" font-weight="700" fill="#17262D">Only an eligible CONFIRMED_HALLUCINATION resolved through the controlled path</text>
    <text x="600" y="1780" font-size="23" text-anchor="middle" font-weight="700" fill="#17262D">can enter the primary hallucination numerator.</text>

    <path d="M 600 140 L 600 230" fill="none" stroke="#333333" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M 600 342 L 600 362 L 340 362 L 340 382" fill="none" stroke="#333333" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M 585 428 L 615 428" fill="none" stroke="#333333" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M 860 474 L 860 555 L 600 555 L 600 590" fill="none" stroke="#333333" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M 600 682 L 600 710 L 215 710 L 215 738" fill="none" stroke="#333333" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M 600 682 L 600 738" fill="none" stroke="#333333" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M 600 682 L 600 710 L 985 710 L 985 738" fill="none" stroke="#333333" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M 215 820 L 215 835 L 20 835 L 20 927 L 50 927" fill="none" stroke="#333333" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M 600 820 L 600 835 L 790 835 L 790 927 L 765 927" fill="none" stroke="#333333" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M 985 820 L 985 882" fill="none" stroke="#333333" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M 600 972 L 600 983 L 1160 983 L 1160 1120 L 1170 1120" fill="none" stroke="#333333" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M 405 1185 L 415 1185 L 415 1442 L 1050 1442 L 1050 1533 L 1020 1533" fill="none" stroke="#333333" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M 600 1578 L 600 1610" fill="none" stroke="#333333" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M 600 1718 L 600 1728" fill="none" stroke="#333333" stroke-width="2.5" marker-end="url(#arrow)"/>
  </g>
</svg>
